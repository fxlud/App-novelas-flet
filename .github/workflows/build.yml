name: Build Flet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: flet build apk --yes --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novela-app-apk
          path: |
            build/apk/*.apk
            **/*.apk
            
