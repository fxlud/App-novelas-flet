name: Build Flet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: |
          set +e
          flet build apk --yes --verbose
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            FLUTTER_BIN="/home/runner/flutter/3.47.9/bin/flutter"
            if [ -x "$FLUTTER_BIN" ]; then
              yes | "$FLUTTER_BIN" doctor --android-licenses || true
            fi
            flet build apk --yes --verbose
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novela-app-apk
          path: |
            build/apk/*.apk
            **/*.apk
            
